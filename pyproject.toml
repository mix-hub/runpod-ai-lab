[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runpod-ai-lab"
version = "0.1.0"
description = "Hands-on tensor, backpropagation and GPU experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.4,<3"]

[tool.setuptools.packages.find]
where = ["src"]
